name: macOS validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Select Xcode 26
        run: sudo xcode-select --switch /Applications/Xcode_26.0.app/Contents/Developer
      - name: Report toolchain
        run: xcodebuild -version && swift --version
      - name: Run regression checks
        run: bash scripts/test.sh
      - name: Build Release
        run: >-
          xcodebuild -project 'Image Converter.xcodeproj'
          -scheme 'Image Converter' -configuration Release
          -destination 'platform=macOS' -derivedDataPath .build/DerivedData
          CODE_SIGNING_ALLOWED=NO build
